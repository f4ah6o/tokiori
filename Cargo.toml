[workspace]
members = [
    "crates/tokiori-model",
    "crates/tokiori-pg",
    "crates/tokiori-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
version = "0.1.0"

[workspace.dependencies]
tokiori-model = { path = "crates/tokiori-model" }
tokiori-pg = { path = "crates/tokiori-pg" }

chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "0.10.4", default-features = false, features = ["std", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
noprop = "0.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-none",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "migrate",
    "macros",
] }
tempfile = "3.27"
thiserror = "2.0.21"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.29", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Debug builds carry no DWARF: the workspace is built many times per change and
# the artifacts are only used for tests, so symbol detail is not worth the disk.
[profile.dev]
debug = 0

[profile.test]
debug = 0
